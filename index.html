<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>sync-canvas — realtime collaborative board</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="18" height="18">
          <rect x="1.5" y="1.5" width="11" height="11" rx="2.5" />
          <rect x="7.5" y="7.5" width="11" height="11" rx="2.5" />
        </svg>
      </span>
      <span class="brand-name">sync&#8209;canvas</span>
      <span class="brand-tag">v1</span>
    </div>

    <button class="room" id="room-btn" title="Copy room link">
      <span class="room-hash">#</span><span id="room-code">—</span>
    </button>

    <div class="topbar-right">
      <div class="peers" id="peers"></div>
      <button class="btn" id="btn-tab" title="Open a second participant in a new tab">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 2H3.5A1.5 1.5 0 0 0 2 3.5v9A1.5 1.5 0 0 0 3.5 14h9A1.5 1.5 0 0 0 14 12.5V10" /><path d="M9 2h5v5" /><path d="M14 2 7.5 8.5" /></svg>
        <span>New tab</span>
      </button>
      <button class="btn btn-danger" id="btn-net" title="Drop the transport and keep editing offline">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 6.5a9 9 0 0 1 12 0" /><path d="M4.4 9.2a5.6 5.6 0 0 1 7.2 0" /><path d="M6.8 11.9a2.2 2.2 0 0 1 2.4 0" /><path d="M2.5 2.5 13.5 13.5" /></svg>
        <span>Disconnect</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="board" class="board" tabindex="0" role="application" aria-label="Collaborative board"></canvas>
    <div class="editor-layer" id="editor-layer"></div>

    <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>

    <div class="zoom" id="zoom">
      <button data-zoom="out" title="Zoom out">−</button>
      <span id="zoom-level">100%</span>
      <button data-zoom="in" title="Zoom in">+</button>
      <button data-zoom="fit" class="zoom-fit" title="Fit to content">fit</button>
    </div>

    <div class="context" id="context" hidden></div>

    <aside class="inspector" id="inspector">
      <div class="insp-head">
        <span class="insp-title">Session</span>
        <span class="insp-badge" id="peer-count">1</span>
      </div>
      <div class="ins-peers" id="peers-list"></div>

      <div class="insp-head insp-head-sub">
        <span class="insp-title">Operation stream</span>
        <button class="insp-toggle" id="stream-toggle" title="Toggle payload detail">raw</button>
      </div>
      <div class="stream" id="stream"></div>

      <div class="insp-head insp-head-sub">
        <span class="insp-title">Engine</span>
      </div>
      <div class="metrics" id="metrics"></div>
      <div class="vv" id="vv"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span class="status-cell" id="net-cell">
      <i class="dot" id="net-dot"></i><span id="net-label">connecting…</span>
    </span>
    <span class="status-sep"></span>
    <span class="status-cell" id="transport-cell">BroadcastChannel</span>
    <span class="status-cell hint" id="hint">drag to move · double-click to type · space to pan</span>
    <span class="status-cell right" id="stats-cell">— ops</span>
    <span class="status-cell credit">ENGINE BY JEROME YOUNG</span>
  </footer>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
